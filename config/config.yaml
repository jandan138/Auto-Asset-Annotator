model:
  # Checked-in default runtime path: local Hugging Face backend.
  backend: "local_hf"
  name: "/cpfs/shared/simulation/zhuzihou/models/Qwen2.5-VL-7B-Instruct"

  # OpenAI-compatible multimodal API example:
  # backend: "openai_compatible"
  # name: "gemini-2.5-flash-image"
  # api_base_url: "https://your-openai-compatible-host"
  # api_key_env: "NEWAPI_API_KEY"
  # api_timeout_seconds: 120
  # api_max_retries: 2

  # API fields are only used when backend=openai_compatible.
  api_base_url: null
  api_key_env: "NEWAPI_API_KEY"
  api_timeout_seconds: 120
  api_max_retries: 2

  # Gemma4 local multimodal example:
  # backend: "local_gemma4_multimodal"
  # name: "/cpfs/user/zhuzihou/models/gemma4/releases/unsloth-gemma-4-E4B-it-unsloth-bnb-4bit/9746c23553347b443ebdc1caba1d41b52223d0c8"
  # Genesis-LLM LoRA adapters are stored separately under
  # /cpfs/user/zhuzihou/models/gemma4/adapters/ and are not enabled by default.

  # These fields apply only to local backends.
  # The openai_compatible backend ignores device_map, dtype, and attn_implementation.
  device_map: "auto"
  dtype: "bfloat16"
  # attn_implementation: "flash_attention_2"
  attn_implementation: "eager"
  temperature: 0.1
  max_new_tokens: 2048

data:
  input_dir: "./data"
  output_dir: "./output"
  # Define how to identify views. Keys are internal logical names, values are filename patterns.
  # Use list for multiple possible patterns.
  views:
    front: ["front.png", "0.png"]
    left: ["left.png", "1.png"]
    back: ["back.png", "2.png"]
    right: ["right.png", "3.png"]
  
  # If thumbnails directory is used (legacy mode)
  use_thumbnails_dir: false
  thumbnails_dir_name: "thumbnails"

processing:
  batch_size: 1  # Not really used in original script for VLM pipeline but good to have
  num_chunks: 1
  chunk_index: 0
  
prompts:
  # Default prompt type to use
  default_type: "extract_object_attributes_prompt"
